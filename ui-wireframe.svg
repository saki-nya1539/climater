<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="980" height="560" fill="#fafafa"/>

  <!-- terminal -->
  <rect x="20" y="20" width="560" height="520" rx="10" fill="#1e1e2e" stroke="#333" stroke-width="2"/>
  <rect x="20" y="20" width="560" height="30" rx="10" fill="#2a2a3d"/>
  <circle cx="40" cy="35" r="5" fill="#e08080"/>
  <circle cx="57" cy="35" r="5" fill="#e0c080"/>
  <circle cx="74" cy="35" r="5" fill="#80c080"/>
  <text x="300" y="40" font-size="12" fill="#aaa" text-anchor="middle">climater — ターミナル</text>

  <text x="35" y="70" font-size="11" fill="#8be9fd">$ Rscript bin/climater.R data/sample_climate.csv \</text>
  <text x="35" y="86" font-size="11" fill="#8be9fd">    --baseline 2015:2019 --plot trend.png</text>

  <text x="35" y="115" font-size="11" fill="#f8f8f2">期間: 2015-01-15 〜 2024-12-15 (10年分)</text>
  <text x="35" y="132" font-size="11" fill="#f8f8f2">基準期間: 2015-2019年</text>
  <text x="35" y="149" font-size="11" fill="#50fa7b">年平均気温トレンド: +0.0981 C/年 (10年あたり +0.98 C)</text>
  <text x="35" y="166" font-size="11" fill="#f8f8f2">決定係数(R^2): 0.732</text>

  <text x="35" y="196" font-size="11" fill="#f1fa8c">年別 平均気温・基準期間との差(アノマリー):</text>
  <text x="35" y="213" font-size="11" fill="#f8f8f2">  2015: 10.22 C (anomaly -0.44 C)</text>
  <text x="35" y="230" font-size="11" fill="#f8f8f2">  2016: 10.60 C (anomaly -0.05 C)</text>
  <text x="35" y="247" font-size="11" fill="#f8f8f2">  ...</text>
  <text x="35" y="264" font-size="11" fill="#f8f8f2">  2024: 11.18 C (anomaly +0.53 C)</text>

  <text x="35" y="294" font-size="11" fill="#50fa7b">グラフを trend.png に保存しました</text>

  <rect x="35" y="330" width="8" height="18" fill="#f8f8f2">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="55" y="345" font-size="11" fill="#6272a4">_</text>

  <!-- plot mockup -->
  <rect x="600" y="20" width="360" height="300" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="2"/>
  <text x="780" y="45" font-size="13" fill="#333" text-anchor="middle">trend.png（イメージ）</text>
  <text x="780" y="62" font-size="10" fill="#666" text-anchor="middle">年平均気温の推移</text>

  <line x1="640" y1="270" x2="920" y2="270" stroke="#999"/>
  <line x1="640" y1="80" x2="640" y2="270" stroke="#999"/>

  <polyline points="650,230 685,210 720,190 755,195 790,198 825,196 860,150 895,155 910,165" fill="none" stroke="#4a6fa5" stroke-width="2"/>
  <g fill="#4a6fa5">
    <circle cx="650" cy="230" r="3"/>
    <circle cx="685" cy="210" r="3"/>
    <circle cx="720" cy="190" r="3"/>
    <circle cx="755" cy="195" r="3"/>
    <circle cx="790" cy="198" r="3"/>
    <circle cx="825" cy="196" r="3"/>
    <circle cx="860" cy="150" r="3"/>
    <circle cx="895" cy="155" r="3"/>
    <circle cx="910" cy="165" r="3"/>
  </g>
  <line x1="645" y1="235" x2="915" y2="160" stroke="#b00020" stroke-width="2" stroke-dasharray="6,4"/>

  <text x="780" y="288" font-size="9" fill="#999" text-anchor="middle">実線: 年平均気温 ／ 破線: 回帰トレンド線</text>

  <!-- report structure box -->
  <rect x="600" y="340" width="360" height="200" rx="10" fill="#f7f9fc" stroke="#dde3ee"/>
  <text x="620" y="365" font-size="12" font-weight="bold" fill="#333">構成</text>
  <text x="620" y="390" font-size="11" fill="#555">R/load_data.R  — CSV読み込み</text>
  <text x="620" y="410" font-size="11" fill="#555">R/stats.R      — 年別/月別集計・アノマリー</text>
  <text x="620" y="430" font-size="11" fill="#555">R/trend.R      — lm()による線形トレンド</text>
  <text x="620" y="450" font-size="11" fill="#555">R/report.R     — テキストレポート整形</text>
  <text x="620" y="470" font-size="11" fill="#555">bin/climater.R — CLIエントリポイント</text>

  <text x="490" y="550" font-size="11" fill="#999" text-anchor="middle">ClimateR — R製 気候データ分析CLI ワイヤーフレーム</text>
</svg>
